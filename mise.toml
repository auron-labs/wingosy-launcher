[tools]
bun = "1.4.0"
hk = "1.57.0"
jq = "1.8.2"
node = "24.20.0"
oxfmt = "latest"
oxlint = "latest"
pkl = "0.31.1"
rust = "1.98.0"
shellcheck = "0.11.0"
shfmt = "3.14.0"
tombi = "1.5.0"
yamlfmt = "0.21.0"
yamllint = "1.38.0"
zizmor = "1.30.0"

[tasks.quality]
description = "Run the complete repository quality gate"
run = "hk check --all"

[tasks.fix]
description = "Apply safe formatting and lint fixes"
run = "hk fix --all"
