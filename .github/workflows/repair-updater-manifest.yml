# Re-upload a corrected latest.json for an existing release (fixes bad installer URLs in the manifest).
name: Repair updater manifest

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. nightly-26156660512 or v0.0.24)'
        required: true
        type: string

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Repair latest.json on release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/repair-updater-manifest.mjs
