---
# Re-upload a corrected latest.json for an existing release (fixes bad
# installer URLs in the manifest).
name: Repair updater manifest
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. nightly-26156660512
          or v0.0.24)'
        required: true
        type: string
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Repair latest.json on release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/repair-updater-manifest.mjs
