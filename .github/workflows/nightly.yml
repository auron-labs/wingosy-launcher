# Nightly channel: prerelease builds (GitHub tag name contains `nightly`).
# The app’s **Nightly** update track picks the newest matching prerelease.
#
# Version: each run from `main` (schedule or workflow_dispatch) bumps PATCH (0.0.1)
# via `scripts/bump-version.mjs` and commits back to main. Tag-only runs use the
# repo version at that tag without bumping.
#
# Ways to publish:
# - Push a tag matching `nightly*` — release uses that tag name.
# - Daily schedule (`nightly-<run_id>`) or Actions → Nightly → Run workflow.
#
# Note: We do **not** gate on “Pacific midnight” at job start. GitHub often starts
# scheduled runs long after the cron slot; a local-time gate then skipped every real
# step while the job still showed success. One UTC cron ≈ one build per day in US
# Pacific (roughly midnight PDT; late evening prior day in PST).

name: Nightly

on:
  push:
    tags:
      - 'nightly*'
  schedule:
    # Single daily slot (UTC). ~00:00 Pacific in PDT; ~23:00 previous day in PST.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      NIGHTLY_TAG: ${{ github.ref_type == 'tag' && github.ref_name ||
        format('nightly-{0}', github.run_id) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.ref ||
            'main') || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Prepare app version (bump PATCH on branch builds)
        id: ver
        shell: bash
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VER=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          else
            VER=$(bun scripts/bump-version.mjs nightly)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri (nightly prerelease)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.NIGHTLY_TAG }}
          releaseName: 'Wingosy Launcher Nightly v${{ steps.ver.outputs.version }} — ${{
            env.NIGHTLY_TAG }}'
          releaseBody: |
            App version **v${{ steps.ver.outputs.version }}** (PATCH bump for nightly).

            Automated **nightly** pre-release. May be unstable.

            - **Tag push:** push a tag matching `nightly*` to publish without waiting for the schedule.
            - **Stable** channel: [Latest release](https://github.com/auron-labs/wingosy-launcher/releases/latest) (`v*` tags, not prerelease).
            - **Beta** channel: run the *Beta* workflow.
          prerelease: true
          releaseDraft: false
          includeUpdaterJson: false

      - name: Upload latest.json (signed updater)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.NIGHTLY_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/write-updater-manifest.mjs

      - name: Commit version bump to main
        if: success() && github.ref == 'refs/heads/main' && github.ref_type != 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore(release): v${VERSION} nightly [skip ci]"
          git push origin HEAD:main
