# Quick checks on every PR and push to main — complements nightly/beta/release installers.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Frontend build
        run: bun run build

      - name: Frontend lint
        run: bun run lint:frontend

      - name: Frontend typecheck
        run: bun run typecheck

      - name: Vitest with coverage
        run: bun run test:coverage

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, llvm-tools-preview

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Cargo tests (non-ignored)
        run: bun run test:rust

      - name: Rust lint
        run: bun run lint:rust

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust coverage
        run: bun run test:coverage:rust

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/frontend
            coverage/rust/lcov.info
          if-no-files-found: error
