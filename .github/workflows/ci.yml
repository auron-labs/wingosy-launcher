---
# Quick checks on every PR and push to main — complements nightly/beta/release
# installers.
name: CI
'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Install Bun dependencies
        run: bun install --frozen-lockfile
      - name: Frontend build
        run: bun run build
      - name: Frontend lint
        run: bun run lint:frontend
      - name: Frontend typecheck
        run: bun run typecheck
      - name: Vitest with coverage
        run: bun run test:coverage
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, llvm-tools-preview
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: './src-tauri -> target'
      - name: Cargo tests (non-ignored)
        run: bun run test:rust
      - name: Rust lint
        run: bun run lint:rust
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cb407c4fe87966b0b9d1f7350974e80c133dd4bb
      - name: Rust coverage
        run: bun run test:coverage:rust
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-reports
          path: |
            coverage/frontend
            coverage/rust/lcov.info
          if-no-files-found: error
